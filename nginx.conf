worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 50M;

        location ~* \.js$ {
            add_header Content-Type "application/javascript; charset=utf-8" always;
            expires 30d;
            access_log off;
            try_files $uri =404;
        }

        location ~* \.css$ {
            add_header Content-Type "text/css; charset=utf-8" always;
            expires 30d;
            access_log off;
            try_files $uri =404;
        }

        # ========================================================
        # 1. PRIMERO: Archivos estáticos (Imágenes, CSS, JS, Fuentes)
        # ========================================================
        location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
            expires 30d;
            access_log off;
            try_files $uri =404;
        }

        # ========================================================
        # 2. SEGUNDO: Regla gigante para la API (Spring Boot)
        # ========================================================
        location ~ ^/(api/|login|auth|buscar|departamento|encuesta|municipio|usuario|file|persona|rol|indicador|reportes|reporte-|comunidad|actividad-economica|ficha-municipio|jac|poblacion|informacion|ico|tipo-encuesta|comite-de-emergencia|personal-|servicio|participacion-ciudadana|programas-educativos|instituciones|atencion-poblacion-infantil|infrasalud|ecosistemas|vias|calidad-de-vida|educacion|finanza|infraestructura-publica|medios-comunicacion|organizacion|politicas-publicas|producto|administracion-publica|seguridad|territorio|vivienda|integrante-hogar|contratos|habilidades-jac|junta-directiva|participacion-jac|proyectos-productivos|documento-adjunto|categoria|parametro|health-check) {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Origin, Accept, X-Requested-With, X-Tenantid" always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0 always;
                add_header Content-Type text/plain always;
                return 204;
            }
            proxy_pass http://datacom-backend:3310;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin "";
            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Vary;
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
        }

        # ========================================================
        # 3. TERCERO: Rutas generales del Frontend (Quasar/Vue)
        # ========================================================
        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Origin, Accept, X-Requested-With, X-Tenantid" always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0 always;
                add_header Content-Type text/plain always;
                return 204;
            }
            error_page 418 = @proxy_post;
            recursive_error_pages on;
            if ($request_method = POST) {
                return 418;
            }
            try_files $uri $uri/ /index.html;
        }

        location @proxy_post {
            proxy_pass http://datacom-backend:3310;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Origin "";
            proxy_connect_timeout 60s;
            proxy_read_timeout 300s;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Vary;
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
        }
    }
}